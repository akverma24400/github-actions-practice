services:
  app:
    image: akash24400/todo-list-app:latest
    build: .
    container_name: todo-app
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: todo_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo-network

  db:
    image: postgres:16-alpine
    container_name: todo-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todo_db"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - todo-network

    volumes:
      - postgres-data:/var/lib/postgresql/data


volumes:
  postgres-data:
    external: true
    name: todo-postgres-data

networks:
  todo-network:
    driver: bridge

