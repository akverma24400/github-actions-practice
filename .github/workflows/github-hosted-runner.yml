name: github-hosted-runner

on:

  workflow_dispatch:

jobs:
  ubuntu-runner:
    runs-on: ubuntu-latest
    steps:
      - name: print OS name
        run: echo "${{runner.os}}"
      - name: Runner Host name
        run: hostname
      - name: current user running the job
        run: whoami

  windows-runner: 
    runs-on: windows-latest
    steps:
      - name: print OS name
        run: echo "${{runner.os}}"

      - name: Runner host name
        run: hostname

      - name: Current user runninng the job
        run: echo $env.USERNAME

  macOS-runner: 
    runs-on: macos-latest
    steps:
      - name: print OS name
        run: echo "${{runner.os}}"

      - name: Runner host name
        run: hostname

      - name: Current user runninng the job
        run: whoami
