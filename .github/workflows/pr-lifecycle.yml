name: Pull Request Event Demo
on:
  pull_request:
    types: 
      - opened
      - synchronize
      - reopened
      - closed

jobs:
  pr-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: print PR details
        run: |
          echo "Event Type: ${{ github.event.action }}"
          echo "PR title: ${{ github.event.pull_request.title }}"
          echo "PR author: ${{ github.event.pull_request.user.login }}"
          echo "Source Branch: ${{ github.head_ref }}"
          echo "Target Branch: ${{ github.base_ref }}"

      - name: PR Opened
        if: github.event.action == 'opened'
        run: echo "PR was opened"

      - name: PR Updated
        if: github.event.action == 'synchronize'
        run: echo "New commits are pushed to the PR"

      - name: PR Reopened
        if: github.event.action == 'reopened'
        run: echo "PR was reopened"

      - name: PR Merged
        if: github.event.pull_request.merged == true
        run: echo "PR was merged into ${{ github.base_ref }}"

      - name: PR closed without Merged
        if: github.event.action == 'closed' && github.event.pull_request.merged == false
        run: echo "PR closed without merging"