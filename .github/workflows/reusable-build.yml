name: reusable-build

on:
  workflow_call:
    inputs:
      app_name:
        description: "Application Name"
        required: true
        type: string

      environment:
        description: "Deployment Environment"
        required: false
        default: "staging"
        type: string

    secrets:
      docker_token:
        required: true

    outputs:              # Map the workflow outputs to job outputs
      build_version:
        value: ${{ jobs.build.outputs.build_version }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Print build info
        env:
          APP_NAME: ${{ inputs.app_name }}
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          echo "Building $APP_NAME for $DEPLOY_ENV"

      - name: Verify Docker Token Status
        env:
          DOCKER_TOKEN: ${{ secrets.docker_token }}
        run: |
          if [ -n "$DOCKER_TOKEN" ]; then
            echo "Docker token is set: true"
          else
            echo "Docker token is set: false"
            exit 1
          fi

      - name: Generate Build Version
        id: set-version
        run: |
          BUILD_VERSION="v1.0-${GITHUB_SHA::7}"
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Generated Build Version: $BUILD_VERSION"