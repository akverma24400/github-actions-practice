name: matrix builds
on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:

  exclude-fail-fast:
    runs-on: ${{matrix.os}}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
        exclude:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: install pythonn version
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: python version name
        run: python --version

      - name: Trigger failure
        if: matrix.python-version == '3.11'
        run: exit 1