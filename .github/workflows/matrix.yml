name: matrix builds
on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  python-matrix:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: install pythonn version
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: python version name
        run: python --version